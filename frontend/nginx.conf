server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow large config uploads through the API proxy
    client_max_body_size 25m;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-cache hashed CRA assets
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Laravel (API, Sanctum CSRF cookie, Filament admin + its Livewire/asset routes)
    location ~ ^/(api|sanctum|admin|livewire|css/filament|js/filament|fonts/filament)(/|$) {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SPA fallback — every non-asset, non-/api request returns index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
