<svg xmlns="http://www.w3.org/2000/svg" width="761" height="304" viewBox="0 0 761 304" role="img" aria-label="atglance check">
<rect width="761" height="304" rx="10" fill="#0f1419"/>
<rect width="761" height="30" rx="10" fill="#1b222b"/><rect y="20" width="761" height="10" fill="#1b222b"/>
<circle cx="18" cy="15" r="6" fill="#ff5f57"/><circle cx="38" cy="15" r="6" fill="#febc2e"/><circle cx="58" cy="15" r="6" fill="#28c840"/>
<text x="380.5" y="20" fill="#7d8792" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">atglance check</text>
<g font-family="DejaVu Sans Mono,Menlo,Consolas,monospace" font-size="14" fill="#d6dde6" xml:space="preserve" style="white-space:pre">
<text x="18" y="56"><tspan fill="#5fd38d">$</tspan><tspan fill="#ffffff"> sudo atglance check</tspan></text>
<text x="18" y="75"><tspan fill="#5fd38d">ok</tspan>    root      running as root</text>
<text x="18" y="94"><tspan fill="#5fd38d">ok</tspan>    settings  /etc/atglance/config.json (mode 600)</text>
<text x="18" y="113"><tspan fill="#5fd38d">ok</tspan>    console   http://localhost:8002 reachable in 38ms, API v1 (console 2.2.0)</text>
<text x="18" y="132"><tspan fill="#5fd38d">ok</tspan>    token     valid for CLI Test Admin (active)</text>
<text x="18" y="151"><tspan fill="#5fd38d">ok</tspan>    clock     within 1s of the console</text>
<text x="18" y="170"><tspan fill="#febc2e">warn</tspan>  system    not registered; run 'sudo atglance system register'</text>
<text x="18" y="189"><tspan fill="#5fd38d">ok</tspan>    systemd   122 services visible over D-Bus</text>
<text x="18" y="208"><tspan fill="#5fd38d">ok</tspan>    journal   /usr/bin/journalctl</text>
<text x="18" y="227"><tspan fill="#5fd38d">ok</tspan>    queue     empty</text>
<text x="18" y="246"><tspan fill="#5fd38d">ok</tspan>    pat       "cli-test-pat" (…gpL7) 30 days left</text>
<text x="18" y="265"><tspan fill="#febc2e">warn</tspan>  sa        no service account key; run 'sudo atglance system service-account set'</text>
<text x="18" y="284"><tspan fill="#febc2e">warn</tspan>  schedule  not enabled; run 'sudo atglance schedule enable'</text>
</g></svg>
