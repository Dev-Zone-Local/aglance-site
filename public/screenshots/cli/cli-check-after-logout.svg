<svg xmlns="http://www.w3.org/2000/svg" width="724" height="247" viewBox="0 0 724 247" role="img" aria-label="atglance check">
<rect width="724" height="247" rx="10" fill="#0f1419"/>
<rect width="724" height="30" rx="10" fill="#1b222b"/><rect y="20" width="724" height="10" fill="#1b222b"/>
<circle cx="18" cy="15" r="6" fill="#ff5f57"/><circle cx="38" cy="15" r="6" fill="#febc2e"/><circle cx="58" cy="15" r="6" fill="#28c840"/>
<text x="362.0" y="20" fill="#7d8792" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">atglance check</text>
<g font-family="DejaVu Sans Mono,Menlo,Consolas,monospace" font-size="14" fill="#d6dde6" xml:space="preserve" style="white-space:pre">
<text x="18" y="56"><tspan fill="#5fd38d">$</tspan><tspan fill="#ffffff"> sudo atglance check</tspan></text>
<text x="18" y="75"><tspan fill="#5fd38d">ok</tspan>    root      running as root</text>
<text x="18" y="94"><tspan fill="#5fd38d">ok</tspan>    settings  /etc/atglance/config.json (mode 600)</text>
<text x="18" y="113"><tspan fill="#ff6b6b">fail</tspan>  token     not logged in: run 'sudo atglance login'</text>
<text x="18" y="132"><tspan fill="#5fd38d">ok</tspan>    systemd   122 services visible over D-Bus</text>
<text x="18" y="151"><tspan fill="#5fd38d">ok</tspan>    journal   /usr/bin/journalctl</text>
<text x="18" y="170"><tspan fill="#5fd38d">ok</tspan>    queue     empty</text>
<text x="18" y="189"><tspan fill="#febc2e">warn</tspan>  pat       not logged in</text>
<text x="18" y="208"><tspan fill="#febc2e">warn</tspan>  sa        not checked; log in first</text>
<text x="18" y="227"><tspan fill="#febc2e">warn</tspan>  schedule  not enabled; run 'sudo atglance schedule enable'</text>
</g></svg>
