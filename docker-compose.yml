# AtGlance — Docker compose
# Brings up: MySQL + Laravel (website, dashboard, API and Filament admin) on one port.
#
# Usage:
#   cp .env.example .env         # fill APP_KEY, ADMIN_PASSWORD, DB_PASSWORD
#   docker compose up -d --build
#   open http://localhost:8080        (site)
#   open http://localhost:8080/admin  (CMS)

services:
  mysql:
    image: mysql:8.4
    container_name: atglance-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-atglance}"
      MYSQL_USER: "${DB_USERNAME:-atglance}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-${DB_PASSWORD}}"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - atglance
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    container_name: atglance-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_NAME: AtGlance
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:?APP_KEY is required (php artisan key:generate --show)}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-atglance}"
      DB_USERNAME: "${DB_USERNAME:-atglance}"
      DB_PASSWORD: "${DB_PASSWORD}"
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-false}"
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@atglance.io}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:8080}"
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
      SANCTUM_STATEFUL_DOMAINS: "${SANCTUM_STATEFUL_DOMAINS:-localhost:8080}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
      GITHUB_REDIRECT_URI: "${GITHUB_REDIRECT_URI:-}"
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - atglance

networks:
  atglance:
    driver: bridge

volumes:
  mysql_data:
